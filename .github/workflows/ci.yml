name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  go:
    name: Go build / vet / test
    runs-on: windows-latest
    env:
      GONOSUMDB: github.com/qomos-w/*
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Placeholder embed assets (real ones come from the Makefile flow)
        shell: bash
        run: |
          mkdir -p pkg/web/dist && touch pkg/web/dist/index.html
          touch pkg/mobileassets/sporemind.apk
          mkdir -p pkg/tokenest/data && touch pkg/tokenest/data/cl100k_base.tiktoken
      - name: Build
        run: go build ./...
      - name: Schema codegen drift (Go)
        run: make gen-schemas-check
      - name: Test
        # Env-integrated suites excluded until they are CI-portable:
        #  - cmd/sporemind-desktop: wails gateway binding tests
        #  - pkg/actor/{glassinteract,lspserver}: speech/audio hardware, LSP
        #    server binaries absent on hosted runners
        #  - pkg/actor/{pluginhost,project,workspace}: subprocess plugin
        #    matrix + git-worktree integration (runner git layout differs)
        #  - pkg/mobileassets: needs the real signed APK
        #  - pkg/runtime: actor timing-sensitive engine tests (slow runners)
        shell: bash
        run: |
          go test $(go list ./... | grep -vE '/(cmd/sporemind-desktop|pkg/actor/glassinteract|pkg/actor/lspserver|pkg/actor/pluginhost|pkg/actor/project|pkg/actor/workspace|pkg/mobileassets|pkg/runtime)$') -count=1 -timeout 45m

  web:
    name: Web build / vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Build frontend (shell → theme → web, mirroring the Makefile flow)
        run: make build-desktop-frontend
      - name: Vitest
        working-directory: web
        run: bunx vitest run

  vendor-drift:
    name: Vendored packages vs pinned upstream
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sporemind
        uses: actions/checkout@v4
        with:
          path: sporemind
      - name: Resolve pinned upstream refs from go.mod
        working-directory: sporemind
        run: |
          echo "GOSPORE_REF=$(grep -oP 'github.com/qomos-w/gospore \K\S+' go.mod)" >> "$GITHUB_ENV"
          echo "SPORE_REF=$(grep -oP 'github.com/qomos-w/spore \K\S+' go.mod)" >> "$GITHUB_ENV"
      - name: Checkout gospore at pinned ref
        uses: actions/checkout@v4
        with:
          repository: qomos-w/gospore
          ref: ${{ env.GOSPORE_REF }}
          path: gospore
      - name: Checkout spore at pinned ref
        uses: actions/checkout@v4
        with:
          repository: qomos-w/spore
          ref: ${{ env.SPORE_REF }}
          path: spore
      - name: Vendor drift check
        working-directory: sporemind
        run: bash scripts/sync-vendor.sh --check
      - uses: actions/setup-go@v5
        with:
          go-version-file: sporemind/go.mod
          cache-dependency-path: sporemind/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run TS schema check
        working-directory: sporemind
        run: make gen-schema-ts-check
