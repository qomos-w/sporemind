<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工作台 · 方案 B 注意力热场</title>
<style>
  :root {
    --board: #0d0c0b;
    --card: #1a1918;
    --line: rgba(255,255,255,.09);
    --text: #ececeb;
    --muted: #8c8a86;
    --accent: #ff7a45;
    --ring: rgba(255,122,69,.45);
    --shadow: 0 26px 50px -26px rgba(0,0,0,.95);
  }
  .light {
    --board: #f6f4f0;
    --card: #ffffff;
    --line: rgba(0,0,0,.09);
    --text: #17161a;
    --muted: #6d6a65;
    --accent: #d2561f;
    --ring: rgba(210,86,31,.4);
    --shadow: 0 24px 44px -28px rgba(60,40,20,.35);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden;
    background: var(--board); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .board { position: fixed; inset: 0; transition: background-color .35s ease; }
  .heat {
    position: absolute;
    width: 900px; height: 900px;
    left: 0; top: 0;
    transform: translate(-50%, -50%);
    pointer-events: none;
    border-radius: 50%;
    background: radial-gradient(circle, color-mix(in srgb, var(--accent) 26%, transparent) 0%, color-mix(in srgb, var(--accent) 10%, transparent) 26%, transparent 62%);
    transition: left 1s cubic-bezier(.22,.8,.24,1), top 1s cubic-bezier(.22,.8,.24,1);
    filter: blur(6px);
    opacity: .9;
  }
  .grain {
    position: absolute; inset: 0; pointer-events: none; opacity: .5;
    background-image: radial-gradient(rgba(255,255,255,.04) 1px, transparent 1px);
    background-size: 3px 3px;
  }
  .light .grain { background-image: radial-gradient(rgba(0,0,0,.05) 1px, transparent 1px); }

  .chrome { position: fixed; top: 18px; left: 18px; z-index: 5000; }
  .mode-switch { display: inline-flex; gap: 4px; padding: 3px; border-radius: 999px; background: color-mix(in srgb, var(--text) 8%, transparent); backdrop-filter: blur(8px); }
  .mode-switch button { display: inline-flex; align-items: center; gap: 6px; border: 0; cursor: pointer; font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 999px; background: transparent; color: var(--muted); transition: background .18s, color .18s; }
  .mode-switch button:hover { color: var(--text); }
  .mode-switch button.active { background: var(--card); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.25); }
  .mode-switch svg { width: 14px; height: 14px; }

  .tools { position: fixed; top: 18px; right: 18px; display: flex; align-items: center; gap: 10px; z-index: 5000; }
  .agent-pill { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); padding: 7px 12px; border-radius: 999px; background: color-mix(in srgb, var(--text) 7%, transparent); border: 1px solid var(--line); backdrop-filter: blur(8px); }
  .agent-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 2.4s ease-out infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 var(--ring) } 70% { box-shadow: 0 0 0 7px transparent } 100% { box-shadow: 0 0 0 0 transparent } }
  .icon-btn { width: 34px; height: 34px; border-radius: 999px; cursor: pointer; display: grid; place-items: center; background: color-mix(in srgb, var(--text) 7%, transparent); border: 1px solid var(--line); color: var(--text); backdrop-filter: blur(8px); }
  .icon-btn:hover { background: color-mix(in srgb, var(--text) 14%, transparent); }
  .icon-btn svg { width: 16px; height: 16px; }

  .card {
    position: absolute;
    width: 236px; height: 156px;
    padding: 16px; border-radius: 20px;
    background: var(--card); border: 1px solid var(--line);
    box-shadow: var(--shadow);
    transform-origin: center center;
    display: flex; flex-direction: column;
    cursor: pointer;
    transition: left .8s cubic-bezier(.22,.8,.24,1), top .8s cubic-bezier(.22,.8,.24,1),
                transform .8s cubic-bezier(.22,.8,.24,1), opacity .7s ease,
                filter .7s ease, border-color .6s ease, box-shadow .6s ease;
    will-change: transform, left, top;
  }
  .card.hot { border-color: var(--ring); box-shadow: 0 0 0 1px var(--ring), 0 34px 70px -28px color-mix(in srgb, var(--accent) 34%, transparent), var(--shadow); }
  .card-head { display: flex; align-items: center; gap: 10px; }
  .glyph { width: 32px; height: 32px; border-radius: 10px; flex: none; display: grid; place-items: center; background: color-mix(in srgb, var(--text) 8%, transparent); }
  .glyph svg { width: 16px; height: 16px; }
  .card.hot .glyph { background: var(--accent); color: #fff; }
  .card-title { font-size: 13.5px; font-weight: 600; }
  .card-sub { font-size: 11px; color: var(--muted); }
  .card-status { margin-top: auto; font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .att-num { margin-left: auto; font-variant-numeric: tabular-nums; opacity: .8; }

  .footer { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--muted); z-index: 5000; }
  .legend { padding: 8px 14px; border-radius: 999px; background: color-mix(in srgb, var(--text) 6%, transparent); border: 1px solid var(--line); backdrop-filter: blur(8px); display: flex; align-items: center; gap: 9px; }
  .legend .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px 2px var(--ring); }
  .reshuffle { border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; font-size: 12.5px; padding: 9px 16px; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
  .reshuffle:hover { border-color: var(--ring); }
  .reshuffle:active { transform: scale(.97); }
  .reshuffle svg { width: 14px; height: 14px; }
</style>
</head>
<body>
  <div class="board" id="board">
    <div class="grain"></div>
    <div class="heat" id="heat"></div>
  </div>

  <div class="chrome">
    <div class="mode-switch" role="tablist" aria-label="启动模式">
      <button role="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></svg>构建</button>
      <button role="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/></svg>应用</button>
      <button role="tab" aria-selected="true" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>工作台</button>
    </div>
  </div>

  <div class="tools">
    <span class="agent-pill"><span class="agent-dot"></span>agent 正在分配注意力</span>
    <button class="icon-btn" id="theme" title="切换白板 / 黑板"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  </div>

  <div class="footer">
    <div class="legend"><span class="dot"></span>热区 = 需要你注意</div>
    <button class="reshuffle" id="move"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>移动注意力焦点</button>
  </div>

<script>
const ICONS = {
  review: '<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
  code: '<path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/>',
  chart: '<path d="M3 3v18h18"/><path d="m7 15 3-4 3 3 5-7"/>',
  chat: '<path d="M21 15a2 2 0 0 1-2 2H8l-4 4V5a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2z"/>',
  globe: '<circle cx="12" cy="12" r="10"/><path d="M2 12h20"/>',
  term: '<path d="m4 17 6-6-6-6"/><path d="M12 19h8"/>',
  grid: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>'
};
const svg = n => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">' + ICONS[n] + '</svg>';

const CARDS = [
  { id: 'review',  title: '审查', sub: 'PR #482', icon: 'review', x: .70, y: .27, rot: 1.6, status: '等待你的确认' },
  { id: 'editor',  title: '编辑器', sub: 'sporemind/web', icon: 'code', x: .26, y: .22, rot: -2.2, status: '2 个文件未保存' },
  { id: 'chart',   title: '构建面板', sub: 'CI 流水线', icon: 'chart', x: .83, y: .60, rot: 2.4, status: '刚刚通过' },
  { id: 'chat',    title: '对话', sub: '主 agent 会话', icon: 'chat', x: .50, y: .53, rot: -.8, status: '3 条新消息' },
  { id: 'browser', title: '浏览器', sub: 'localhost:5173', icon: 'globe', x: .14, y: .61, rot: 2.9, status: '已加载' },
  { id: 'term',    title: '终端', sub: 'make dev', icon: 'term', x: .62, y: .80, rot: -1.7, status: '运行中 12 分钟' },
  { id: 'apps',    title: '应用', sub: '12 个已安装', icon: 'grid', x: .35, y: .80, rot: 1.1, status: '空闲' }
];

const board = document.getElementById('board');
const heat = document.getElementById('heat');
let focus = 'review';
const nodes = {};

CARDS.forEach(c => {
  const el = document.createElement('article');
  el.className = 'card';
  el.innerHTML =
    '<div class="card-head"><span class="glyph">' + svg(c.icon) + '</span>' +
    '<span><span class="card-title">' + c.title + '</span><br><span class="card-sub">' + c.sub + '</span></span></div>' +
    '<div class="card-status"><span>' + c.status + '</span><span class="att-num"></span></div>';
  el.addEventListener('click', () => { focus = c.id; render(); });
  board.appendChild(el);
  nodes[c.id] = el;
});

function render() {
  const W = window.innerWidth, H = window.innerHeight;
  const f = CARDS.find(c => c.id === focus);
  const fx = f.x * W, fy = f.y * H;
  heat.style.left = fx + 'px';
  heat.style.top = fy + 'px';

  CARDS.forEach(c => {
    const el = nodes[c.id];
    const px = c.x * W, py = c.y * H;
    const d = Math.hypot(px - fx, py - fy);
    const att = Math.max(0.08, 1 - d / (Math.min(W, H) * 0.62));
    const s = 0.92 + att * 0.55;
    el.style.left = px + 'px';
    el.style.top = py + 'px';
    el.style.transform = 'translate(-50%,-50%) rotate(' + c.rot + 'deg) scale(' + s + ')';
    el.style.opacity = (0.42 + att * 0.58).toFixed(3);
    el.style.filter = att > 0.55 ? 'none' : 'grayscale(' + ((0.55 - att) * 1.1).toFixed(2) + ') brightness(' + (0.72 + att * 0.4).toFixed(2) + ')';
    el.style.zIndex = Math.round(10 + att * 100);
    el.classList.toggle('hot', c.id === focus);
    el.querySelector('.att-num').textContent = Math.round(att * 100);
  });
}

document.getElementById('move').addEventListener('click', () => {
  const others = CARDS.filter(c => c.id !== focus);
  focus = others[Math.floor(Math.random() * others.length)].id;
  render();
});
document.getElementById('theme').addEventListener('click', () => document.body.classList.toggle('light'));
window.addEventListener('resize', render);
render();
</script>
</body>
</html>
