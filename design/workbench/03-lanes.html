<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工作台 · 方案 C 注意力传送带</title>
<style>
  :root {
    --board: #0c0c0e;
    --band: rgba(255,255,255,.025);
    --band-line: rgba(255,255,255,.06);
    --card: #1a1a1e;
    --line: rgba(255,255,255,.09);
    --text: #ececef;
    --muted: #86888f;
    --accent: #5ee0a8;
    --ring: rgba(94,224,168,.45);
    --shadow: 0 20px 40px -24px rgba(0,0,0,.9);
  }
  .light {
    --board: #f4f5f3;
    --band: rgba(0,0,0,.022);
    --band-line: rgba(0,0,0,.06);
    --card: #ffffff;
    --line: rgba(0,0,0,.09);
    --text: #16181a;
    --muted: #6b6e72;
    --accent: #14915f;
    --ring: rgba(20,145,95,.4);
    --shadow: 0 20px 40px -28px rgba(20,40,30,.35);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden;
    background: var(--board); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .board { position: fixed; inset: 0; }
  .band {
    position: absolute; left: 24px; right: 24px;
    border-radius: 24px;
    background: var(--band);
    border: 1px solid var(--band-line);
    transition: background-color .35s ease;
  }
  .band-label {
    position: absolute; left: 40px; width: 78px;
    transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 3px;
    pointer-events: none;
  }
  .band-label b { font-size: 13px; font-weight: 600; letter-spacing: .01em; }
  .band-label span { font-size: 11px; color: var(--muted); }

  .chrome { position: fixed; top: 18px; left: 18px; z-index: 5000; }
  .mode-switch { display: inline-flex; gap: 4px; padding: 3px; border-radius: 999px; background: color-mix(in srgb, var(--text) 8%, transparent); backdrop-filter: blur(8px); }
  .mode-switch button { display: inline-flex; align-items: center; gap: 6px; border: 0; cursor: pointer; font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 999px; background: transparent; color: var(--muted); transition: background .18s, color .18s; }
  .mode-switch button:hover { color: var(--text); }
  .mode-switch button.active { background: var(--card); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.25); }
  .mode-switch svg { width: 14px; height: 14px; }

  .tools { position: fixed; top: 18px; right: 18px; display: flex; align-items: center; gap: 10px; z-index: 5000; }
  .agent-pill { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); padding: 7px 12px; border-radius: 999px; background: color-mix(in srgb, var(--text) 7%, transparent); border: 1px solid var(--line); backdrop-filter: blur(8px); }
  .agent-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 2.4s ease-out infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 var(--ring) } 70% { box-shadow: 0 0 0 7px transparent } 100% { box-shadow: 0 0 0 0 transparent } }
  .icon-btn { width: 34px; height: 34px; border-radius: 999px; cursor: pointer; display: grid; place-items: center; background: color-mix(in srgb, var(--text) 7%, transparent); border: 1px solid var(--line); color: var(--text); backdrop-filter: blur(8px); }
  .icon-btn:hover { background: color-mix(in srgb, var(--text) 14%, transparent); }
  .icon-btn svg { width: 16px; height: 16px; }

  .card {
    position: absolute;
    padding: 15px 16px; border-radius: 18px;
    background: var(--card); border: 1px solid var(--line);
    box-shadow: var(--shadow);
    display: flex; flex-direction: column;
    cursor: pointer;
    transition: left .75s cubic-bezier(.22,.8,.24,1), top .75s cubic-bezier(.22,.8,.24,1),
                width .75s cubic-bezier(.22,.8,.24,1), height .75s cubic-bezier(.22,.8,.24,1),
                opacity .6s ease, filter .6s ease, border-color .5s ease, box-shadow .5s ease;
    will-change: left, top, width, height;
    overflow: hidden;
  }
  .card.lead { border-color: var(--ring); box-shadow: 0 0 0 1px var(--ring), 0 30px 60px -28px color-mix(in srgb, var(--accent) 30%, transparent); }
  .card-head { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .glyph { width: 32px; height: 32px; border-radius: 10px; flex: none; display: grid; place-items: center; background: color-mix(in srgb, var(--text) 8%, transparent); }
  .glyph svg { width: 16px; height: 16px; }
  .card.lead .glyph { background: var(--accent); color: #06231a; }
  .card-title { font-size: 13.5px; font-weight: 600; white-space: nowrap; }
  .card-sub { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .card-status { margin-top: auto; font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .att-num { margin-left: auto; font-variant-numeric: tabular-nums; opacity: .8; }
  .card.compact { flex-direction: row; align-items: center; padding: 10px 14px; }
  .card.compact .card-sub, .card.compact .card-status { display: none; }
  .card.compact .glyph { width: 26px; height: 26px; border-radius: 8px; }
  .card.compact .card-title { font-size: 12.5px; }

  .footer { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--muted); z-index: 5000; }
  .hint { padding: 8px 14px; border-radius: 999px; background: color-mix(in srgb, var(--text) 6%, transparent); border: 1px solid var(--line); backdrop-filter: blur(8px); }
  .btn { border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; font-size: 12.5px; padding: 9px 16px; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
  .btn:hover { border-color: var(--ring); }
  .btn:active { transform: scale(.97); }
  .btn svg { width: 14px; height: 14px; }
</style>
</head>
<body>
  <div class="board" id="board"></div>

  <div class="chrome">
    <div class="mode-switch" role="tablist" aria-label="启动模式">
      <button role="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></svg>构建</button>
      <button role="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/></svg>应用</button>
      <button role="tab" aria-selected="true" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>工作台</button>
    </div>
  </div>

  <div class="tools">
    <span class="agent-pill"><span class="agent-dot"></span>agent 正在排序注意力</span>
    <button class="icon-btn" id="theme" title="切换白板 / 黑板"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  </div>

  <div class="footer">
    <span class="hint">点卡片提升为「现在」 · 注意力随时间向下衰减</span>
    <button class="btn" id="decay"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg>衰减一轮</button>
  </div>

<script>
const ICONS = {
  review: '<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
  code: '<path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/>',
  chart: '<path d="M3 3v18h18"/><path d="m7 15 3-4 3 3 5-7"/>',
  chat: '<path d="M21 15a2 2 0 0 1-2 2H8l-4 4V5a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2z"/>',
  globe: '<circle cx="12" cy="12" r="10"/><path d="M2 12h20"/>',
  term: '<path d="m4 17 6-6-6-6"/><path d="M12 19h8"/>',
  grid: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>'
};
const svg = n => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">' + ICONS[n] + '</svg>';

const CARDS = [
  { id: 'review',  title: '审查', sub: 'PR #482', icon: 'review', att: .93, status: '等待你的确认' },
  { id: 'editor',  title: '编辑器', sub: 'sporemind/web', icon: 'code', att: .70, status: '2 个文件未保存' },
  { id: 'chart',   title: '构建面板', sub: 'CI 流水线', icon: 'chart', att: .52, status: '刚刚通过' },
  { id: 'chat',    title: '对话', sub: '主 agent 会话', icon: 'chat', att: .44, status: '3 条新消息' },
  { id: 'browser', title: '浏览器', sub: 'localhost:5173', icon: 'globe', att: .30, status: '已加载' },
  { id: 'term',    title: '终端', sub: 'make dev', icon: 'term', att: .22, status: '运行中 12 分钟' },
  { id: 'apps',    title: '应用', sub: '12 个已安装', icon: 'grid', att: .12, status: '空闲' }
];
const BANDS = [
  { id: 'now',  label: '现在',   note: '最高注意力', min: .66, h: 176, w: 300, pad: 220 },
  { id: 'work', label: '进行中', note: '后台推进',   min: .33, h: 122, w: 232, pad: 200 },
  { id: 'back', label: '背景',   note: '等待唤醒',   min: -1,  h: 64,  w: 196, pad: 150 }
];

const board = document.getElementById('board');
const nodes = {};
const bandEls = {};

CARDS.forEach(c => {
  const el = document.createElement('article');
  el.className = 'card';
  el.innerHTML =
    '<div class="card-head"><span class="glyph">' + svg(c.icon) + '</span>' +
    '<span style="min-width:0"><span class="card-title">' + c.title + '</span><br><span class="card-sub">' + c.sub + '</span></span></div>' +
    '<div class="card-status"><span>' + c.status + '</span><span class="att-num"></span></div>';
  el.addEventListener('click', () => promote(c.id));
  board.appendChild(el);
  nodes[c.id] = el;
});

function bandOf(att) { return BANDS.find(b => att >= b.min) || BANDS[BANDS.length - 1]; }

function bandGeom() {
  const W = window.innerWidth, H = window.innerHeight;
  const top = 96, bottom = 74;
  const gap = 16;
  const total = H - top - bottom - gap * (BANDS.length - 1);
  const weights = [1.45, 1, .72];
  const sum = weights.reduce((a, b) => a + b, 0);
  let y = top;
  return BANDS.map((b, i) => {
    const h = total * weights[i] / sum;
    const g = { band: b, y, h, cy: y + h / 2 };
    y += h + gap;
    return g;
  });
}

function render() {
  const W = window.innerWidth;
  const geoms = bandGeom();

  // band tracks + labels (once)
  geoms.forEach((g, i) => {
    if (!bandEls[g.band.id]) {
      const t = document.createElement('div');
      t.className = 'band';
      board.insertBefore(t, board.firstChild);
      const l = document.createElement('div');
      l.className = 'band-label';
      board.insertBefore(l, board.firstChild);
      bandEls[g.band.id] = { t, l };
    }
    const { t, l } = bandEls[g.band.id];
    t.style.top = g.y + 'px'; t.style.height = g.h + 'px';
    l.style.top = g.cy + 'px';
  });

  const groups = BANDS.map(b => ({ b, items: CARDS.filter(c => bandOf(c.att) === b).sort((a, z) => z.att - a.att) }));

  groups.forEach(grp => {
    const g = geoms.find(x => x.band === grp.b);
    grp.l.innerHTML = '<b>' + grp.b.label + '</b><span>' + grp.items.length + ' 张 · ' + grp.b.note + '</span>';
    const gap = 16;
    const n = grp.items.length;
    const totalW = n * grp.b.w + (n - 1) * gap;
    const avail = W - 40 - grp.b.pad - 24;
    const startX = 40 + grp.b.pad + Math.max(0, (avail - totalW) / 2);
    grp.items.forEach((c, i) => {
      const el = nodes[c.id];
      const compact = grp.b.id === 'back';
      el.classList.toggle('compact', compact);
      el.classList.toggle('lead', grp.b.id === 'now' && i === 0);
      el.style.width = grp.b.w + 'px';
      el.style.height = grp.b.h + 'px';
      el.style.left = (startX + i * (grp.b.w + gap)) + 'px';
      el.style.top = (g.cy - grp.b.h / 2) + 'px';
      el.style.opacity = (0.5 + Math.min(.5, c.att) * 1).toFixed(2);
      el.style.filter = grp.b.id === 'back' ? 'grayscale(.5) brightness(.8)' : 'none';
      el.style.zIndex = Math.round(10 + c.att * 100);
      el.style.transform = 'none';
      el.querySelector('.att-num').textContent = Math.round(c.att * 100);
    });
  });
}

function promote(id) {
  CARDS.forEach(c => { c.att = c.id === id ? .96 : c.att * .8; });
  render();
}
document.getElementById('decay').addEventListener('click', () => {
  CARDS.forEach(c => c.att *= .62);
  render();
});
document.getElementById('theme').addEventListener('click', () => document.body.classList.toggle('light'));
window.addEventListener('resize', render);
render();
</script>
</body>
</html>
